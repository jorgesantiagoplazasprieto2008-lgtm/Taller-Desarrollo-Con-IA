version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: entrecopas-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootPass2026*}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-entrecopas_db}
      MYSQL_USER: ${MYSQL_USER:-entrecopas_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-EntrecopasPass2026*}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-RootPass2026*}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - entrecopas-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: entrecopas-app
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-entrecopas_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-entrecopas_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-EntrecopasPass2026*}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
    networks:
      - entrecopas-network

volumes:
  mysql_data:
    driver: local

networks:
  entrecopas-network:
    driver: bridge
